<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgendaFácil</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            AgendaFácil
        </div>

        <nav class="menu">

            <a href="#" class="active">
                Início
            </a>

            <a href="#">
                Agendamento
            </a>

            <a href="#">
                Perfil
            </a>

        </nav>

    </header>


    <!-- CONTEÚDO -->
    <main class="container">

        <!-- BOAS-VINDAS -->
        <section class="welcome">

            <h1>
                Olá, Pedro
            </h1>

            <p>
                Encontre um serviço e faça seu próximo agendamento.
            </p>

        </section>


        <!-- CATEGORIAS -->
        <section class="categories">

            <h2>
                Categorias
            </h2>


            <div class="category-list">

                <!-- TECNOLOGIA -->
                <article class="category-card">

                    <div class="category-icon">

                        <img
                            src="icons/tecnologia.svg"
                            alt="Tecnologia">

                    </div>

                    <h3>
                        Tecnologia
                    </h3>

                    <p>
                        Assistência e suporte
                    </p>

                </article>


                <!-- AUTOMOTIVO -->
                <article class="category-card">

                    <div class="category-icon">

                        <img
                            src="icons/automotivo.svg"
                            alt="Automotivo">

                    </div>

                    <h3>
                        Automotivo
                    </h3>

                    <p>
                        Cuidados com seu carro
                    </p>

                </article>

            </div>

        </section>


        <!-- AGENDAMENTOS -->
        <section class="appointments">

            <h2>
                Próximos agendamentos
            </h2>


            <article class="appointment-card">

                <div class="appointment-info">

                    <h3>
                        Formatação de Computador
                    </h3>

                    <p>
                        20 de agosto • 10:30 • Unidade Centro
                    </p>

                </div>


                <button class="appointment-button">
                    Ver Agendamento
                </button>

            </article>

        </section>

    </main>

</body>

</html>
