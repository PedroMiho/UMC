<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Lista de Produtos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:white;
}

main{
    flex:1;
}

footer{
    background:#212529;
    color:white;
    text-align:center;
    padding:15px;
}

</style>

</head>

<body>

<!-- HEADER -->
<nav class="navbar navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="index.html">
ProductHub
</a>

<div>
<a href="../index.html" class="btn btn-outline-light btn-sm">Home</a>
<a href="cadastro.html" class="btn btn-outline-light btn-sm">Cadastrar</a>
</div>

</div>
</nav>


<!-- CONTEÚDO -->
<main>

<div class="container mt-5">

<h2>Produtos Cadastrados</h2>

<table class="table table-striped table-bordered">

<thead class="table-dark">

<tr>
<th>ID</th>
<th>Produto</th>
<th>Marca</th>
<th>Tamanho</th>
<th>Preço</th>
<th>Quantidade</th>
<th>Valor Estoque</th>
</tr>

</thead>

<tbody id="tabelaProdutos">

</tbody>

</table>

<a href="cadastro.html" class="btn btn-primary">
Cadastrar Novo Produto
</a>

</div>

</main>


<!-- FOOTER -->
<footer>

<p>© 2026 ProductHub - Sistema de Gerenciamento de Produtos</p>

</footer>


<script>

async function carregarProdutos(){

    try {

        let resposta = await fetch("http://localhost:8080/produtos");

        let produtos = await resposta.json();

        let tabela = document.getElementById("tabelaProdutos");

        tabela.innerHTML = "";

        produtos.forEach((produto, index) => {

            let valorEstoque = produto.preco * produto.quantidade;

            tabela.innerHTML += `
            <tr>
                <td>${index}</td>
                <td>${produto.nome}</td>
                <td>${produto.marca}</td>
                <td>${produto.tamanho}</td>
                <td>R$ ${produto.preco}</td>
                <td>${produto.quantidade}</td>
                <td>R$ ${valorEstoque}</td>
            </tr>
            `;

        });

    } catch (erro) {
        console.error("Erro ao buscar produtos:", erro);
        alert("Erro ao carregar produtos!");
    }

}

// chama a função ao carregar a página
carregarProdutos();

</script>

</body>
</html>
