<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!--
        viewport:
        Faz a página se adaptar à largura do dispositivo.

        width=device-width:
        utiliza a largura real da tela.

        initial-scale=1.0:
        define o nível inicial de zoom.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Navbar Bootstrap</title>


    <!--
        Bootstrap CSS

        Importa o arquivo CSS do Bootstrap através de uma CDN.

        CDN = Content Delivery Network.

        É através desse arquivo que podemos utilizar
        classes como navbar, container, btn, d-flex etc.
    -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body>

    
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

</body>

</html>
