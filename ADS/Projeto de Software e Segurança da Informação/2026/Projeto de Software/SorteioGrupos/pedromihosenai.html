<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pra você 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0d0812;
    overflow: hidden;
    font-family: 'Lora', serif;
    cursor: default;
  }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; width: 2px; height: 2px;
    background: #fff; border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite; opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: var(--o); transform: scale(1.2); }
  }

  /* hint + dots — pointer-events none para nao bloquear o coracao */
  #screen1 {
    position: fixed; inset: 0; z-index: 10;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  #screen1.hide { opacity: 0; }

  .hint {
    position: fixed; top: 12%; left: 50%; transform: translateX(-50%);
    font-family: 'Lora', serif; font-style: italic;
    color: #c9a0c0; font-size: 1.05rem; letter-spacing: 0.04em;
    white-space: nowrap; text-align: center;
    animation: fadeIn 1.5s ease 0.5s forwards; opacity: 0;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  .clicks-counter {
    position: fixed; bottom: 10%; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid #7a3e6a; background: transparent;
    transition: background 0.4s ease, border-color 0.4s ease, transform 0.3s ease;
  }
  .dot.filled { background: #e05c8a; border-color: #e05c8a; transform: scale(1.3); }

  /* coracao — fora do screen1, z-index proprio */
  .heart-wrap {
    position: fixed;
    z-index: 20;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: left 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                top  0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .heart-wrap:hover .heart-svg { filter: drop-shadow(0 0 24px #e05c8a); }

  .heart-svg {
    width: 160px; height: 160px;
    filter: drop-shadow(0 0 12px #c0436a);
    animation: floatHeart 3s ease-in-out infinite;
  }
  @keyframes floatHeart {
    0%, 100% { transform: translateY(0) scale(1); }
    50%       { transform: translateY(-10px) scale(1.04); }
  }
  .heart-svg.pop { animation: popHeart 0.4s ease forwards; }
  @keyframes popHeart {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.45); }
    65%  { transform: scale(0.85); }
    100% { transform: scale(1); }
  }

  /* particulas */
  .particle {
    position: fixed; pointer-events: none; font-size: 1.2rem;
    animation: floatParticle 1.2s ease forwards; z-index: 100;
  }
  @keyframes floatParticle {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3); }
  }

  /* tela 2 */
  #screen2 {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 1s ease;
  }
  #screen2.show { opacity: 1; pointer-events: all; }

  .reveal-bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, #1a0520 0%, #0d0812 70%);
  }
  .reveal-card {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    gap: 2rem; text-align: center; padding: 2rem;
    max-width: 420px; width: 90%;
    transform: scale(0.8) translateY(30px); opacity: 0;
    transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease;
  }
  #screen2.show .reveal-card { transform: scale(1) translateY(0); opacity: 1; }

  .big-message {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 8vw, 3.4rem); font-style: italic;
    color: #f5d0e0; line-height: 1.2; text-shadow: 0 0 40px #e05c8a88;
  }
  .sub-message {
    font-family: 'Lora', serif; font-size: 1rem;
    color: #c9a0c0; font-style: italic; letter-spacing: 0.05em;
  }

  .photo-frame {
    width: 220px; height: 220px; border-radius: 50%;
    border: 2.5px solid #c0436a66;
    box-shadow: 0 0 30px #e05c8a44, 0 0 80px #c0436a22;
    overflow: hidden; position: relative; background: #1a0520;
    display: flex; align-items: center; justify-content: center;
  }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .placeholder-inside {
    display: flex; flex-direction: column; align-items: center;
    gap: 0.5rem; color: #7a3e6a; font-size: 0.8rem;
    font-style: italic; text-align: center; padding: 1rem;
  }
  .placeholder-icon { font-size: 3rem; line-height: 1; }

  .petal {
    position: fixed; top: -30px; pointer-events: none; z-index: 1;
    font-size: 1.1rem;
    animation: fallPetal var(--fd) linear var(--fdelay) infinite; opacity: 0;
  }
  @keyframes fallPetal {
    0%   { opacity: 0; transform: translateY(0) rotate(0deg); }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(110vh) rotate(360deg); }
  }

  .sparkle {
    position: absolute; pointer-events: none;
    width: 6px; height: 6px; border-radius: 50%; background: #f5d0e0;
    animation: sparklePulse 2s ease-in-out infinite;
  }
  @keyframes sparklePulse {
    0%, 100% { opacity: 0; transform: scale(0); }
    50%       { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- hint e dots (pointer-events: none nao bloqueia o coracao) -->
<div id="screen1">
  <p class="hint">clique no coração ✨</p>
  <div class="clicks-counter" id="dots">
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
    <div class="dot" id="d4"></div>
    <div class="dot" id="d5"></div>
  </div>
</div>

<!-- coracao FORA do screen1 — recebe cliques normalmente -->
<div class="heart-wrap" id="heartBtn">
  <svg class="heart-svg" id="heartSvg" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f06292"/>
        <stop offset="100%" stop-color="#ad1457"/>
      </linearGradient>
    </defs>
    <path d="M50 85 C50 85 5 55 5 28 C5 14 16 5 28 5 C37 5 45 10 50 18 C55 10 63 5 72 5 C84 5 95 14 95 28 C95 55 50 85 50 85Z" fill="url(#hg)"/>
  </svg>
</div>

<!-- tela 2 -->
<div id="screen2">
  <div class="reveal-bg"></div>
  <div class="reveal-card">
    <div class="big-message">tô com saudades</div>
  </div>
</div>

<script>
  const HEART_W = 160, HEART_H = 160;
  let clicks = 0;

  // estrelas
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--o:${0.3+Math.random()*0.7};animation-delay:${Math.random()*4}s`;
    starsEl.appendChild(s);
  }

  // posicao inicial: centro
  const heartBtn = document.getElementById('heartBtn');
  let curX = window.innerWidth  / 2 - HEART_W / 2;
  let curY = window.innerHeight / 2 - HEART_H / 2;
  heartBtn.style.left = curX + 'px';
  heartBtn.style.top  = curY + 'px';

  // evento via addEventListener (mais confiavel que onclick inline)
  heartBtn.addEventListener('click', handleClick);

  function randomPos() {
    const mg = 40;
    const maxX = window.innerWidth  - HEART_W - mg;
    const maxY = window.innerHeight - HEART_H - mg;
    let x, y, t = 0;
    do {
      x = mg + Math.random() * maxX;
      y = mg + Math.random() * maxY;
      t++;
    } while (t < 20 && Math.abs(x - curX) < 120 && Math.abs(y - curY) < 120);
    return { x, y };
  }

  function handleClick() {
    if (clicks >= 5) return;
    clicks++;

    // animacao pop
    const svg = document.getElementById('heartSvg');
    svg.classList.remove('pop');
    void svg.offsetWidth;
    svg.classList.add('pop');
    svg.addEventListener('animationend', () => svg.classList.remove('pop'), { once: true });

    // preenche dot
    document.getElementById('d' + clicks).classList.add('filled');

    // particulas na posicao atual
    const r = heartBtn.getBoundingClientRect();
    spawnParticles(r.left + HEART_W / 2, r.top + HEART_H / 2);

    if (clicks === 5) { setTimeout(showReveal, 500); return; }

    // move coracao apos 200ms
    setTimeout(() => {
      const { x, y } = randomPos();
      curX = x; curY = y;
      heartBtn.style.left = x + 'px';
      heartBtn.style.top  = y + 'px';
    }, 200);
  }

  function spawnParticles(x, y) {
    const emojis = ['💕','✨','🌸','💖','⭐'];
    for (let i = 0; i < 8; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const angle = Math.random() * Math.PI * 2;
      const dist  = 60 + Math.random() * 80;
      p.style.cssText = `left:${x}px;top:${y}px;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist-40}px;animation-delay:${Math.random()*0.2}s`;
      document.body.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
  }

  function showReveal() {
    document.getElementById('screen1').classList.add('hide');
    heartBtn.style.display = 'none';
    document.getElementById('screen2').classList.add('show');
    spawnPetals();
    addSparkles();
  }

  function spawnPetals() {
    const items = ['🌸','🌺','💮','🌷','✿'];
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = items[Math.floor(Math.random() * items.length)];
      p.style.cssText = `left:${Math.random()*100}%;--fd:${4+Math.random()*5}s;--fdelay:${Math.random()*4}s`;
      document.body.appendChild(p);
    }
  }

  function addSparkles() {
    const frame = document.getElementById('photoFrame');
    for (let i = 0; i < 8; i++) {
      const sp = document.createElement('div');
      sp.className = 'sparkle';
      const angle = (i / 8) * Math.PI * 2;
      sp.style.cssText = `left:${110 + 120*Math.cos(angle)}px;top:${110 + 120*Math.sin(angle)}px;animation-delay:${i*0.25}s`;
      frame.parentElement.appendChild(sp);
    }
  }
</script>
</body>
</html>
