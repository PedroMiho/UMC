<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Mini Loja de Roupas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center; /* Centraliza os itens */
      padding: 40px;
    }

    .item {
      background: white;
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      width: 180px;
      text-align: center;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
      display: inline-block;  /* Mantém os itens lado a lado */
      margin: 10px;
    }

    .item img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .item h3 {
      font-size: 16px;
      margin: 5px 0;
    }

    .item p {
      font-size: 14px;
      color: #555;
      margin: 5px 0;
    }

    .preco {
      font-weight: bold;
      color: #0077cc;
      margin: 10px 0;
    }

    .btn-comprar {
      display: inline-block;
      background: #0077cc;
      color: white;
      padding: 8px 12px;
      border-radius: 5px;
      text-decoration: none;
    }

    .btn-comprar:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <div class="item">
    <img src="images.jpg" alt="Camiseta Azul">
    <h3>Camiseta Azul</h3>
    <p>100% algodão</p>
    <p class="preco">R$ 59,90</p>
    <a href="#" class="btn-comprar">Comprar</a>
  </div>

  <div class="item">
    <img src="roupas-country-calca-jeans-masculino-azul-marinho-mcs7700-p-1722291814355.jpg" alt="Calça Jeans">
    <h3>Calça Jeans</h3>
    <p>Modelagem Slim</p>
    <p class="preco">R$ 129,90</p>
    <a href="#" class="btn-comprar">Comprar</a>
  </div>

  <div class="item">
    <img src="1_preta-0755e2520fcde918b516780560897023-1024-1024.jpg" alt="Jaqueta Preta">
    <h3>Jaqueta Preta</h3>
    <p>Couro sintético</p>
    <p class="preco">R$ 199,90</p>
    <a href="#" class="btn-comprar">Comprar</a>
  </div>
</body>
</html>
