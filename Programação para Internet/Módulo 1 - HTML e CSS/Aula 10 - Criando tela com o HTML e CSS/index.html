<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgendaFácil</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="header">

        <div class="logo">
            AgendaFácil
        </div>

        <nav class="menu">
            <a href="#" class="active">Início</a>
            <a href="#">Agendamento</a>
            <a href="#">Perfil</a>
        </nav>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container">

        <!-- BOAS-VINDAS -->
        <section class="welcome">

            <h1>Olá, Pedro</h1>

            <p>
                Encontre um serviço e faça seu próximo agendamento.
            </p>

        </section>


        <!-- CATEGORIAS -->
        <section class="categories">

            <h2>Categorias</h2>

            <div class="category-list">

                <!-- Tecnologia -->
                <div class="category-card">

                    <div class="category-icon">
                        <svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg">

                            <path
                                d="M9 3V21"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"/>

                            <path
                                d="M15 3V21"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"/>

                            <path
                                d="M3 9H21"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"/>

                            <path
                                d="M3 15H21"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"/>

                        </svg>
                    </div>

                    <h3>Tecnologia</h3>

                    <p>Assistência e suporte</p>

                </div>


                <!-- Automotivo -->
                <div class="category-card">

                    <div class="category-icon">

                        <svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg">

                            <path
                                d="M5 17L6.5 9H17.5L19 17"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"/>

                            <path
                                d="M7 9L8.5 5H15.5L17 9"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"/>

                            <path
                                d="M4 17H20V20H4V17Z"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linejoin="round"/>

                            <circle
                                cx="7"
                                cy="17"
                                r="1"
                                fill="currentColor"/>

                            <circle
                                cx="17"
                                cy="17"
                                r="1"
                                fill="currentColor"/>

                        </svg>

                    </div>

                    <h3>Automotivo</h3>

                    <p>Cuidados com seu carro</p>

                </div>

            </div>

        </section>


        <!-- PRÓXIMOS AGENDAMENTOS -->
        <section class="appointments">

            <h2>Próximos agendamentos</h2>


            <div class="appointment-card">

                <div class="appointment-info">

                    <h3>Formatação de Computador</h3>

                    <p>
                        20 de agosto • 10:30 • Unidade Centro
                    </p>

                </div>


                <button class="appointment-button">
                    Ver Agendamento
                </button>

            </div>

        </section>

    </main>

</body>
</html>
